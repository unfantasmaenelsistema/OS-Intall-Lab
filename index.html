<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icono.png" />
    <link rel="icon" type="image/svg+xml" href="/icono.svg" />
    <title>Simulador de Instalación de Sistemas Operativos | Linux &amp; Windows Server</title>
    <meta name="description" content="Simulador formativo interactivo de instalación de Linux y Windows Server con particionado avanzado, ext4/XFS/Btrfs, LVM, LUKS y análisis de repercusiones." />
    <meta property="og:title" content="Simulador de Instalación de Sistemas Operativos" />
    <meta property="og:description" content="Simulador formativo interactivo de instalación de Linux y Windows Server con particionado avanzado, ext4/XFS/Btrfs, LVM, LUKS y análisis de repercusiones." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('os-simulator-theme');
          var isLight = saved === 'light' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
          if (isLight) {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
